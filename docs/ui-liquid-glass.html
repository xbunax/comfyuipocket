if(n.preview)s+=`<rect x="${n.x+9}" y="${n.y+78}" width="${n.w-18}" height="130" fill="#b0b9c7"/><path d="M${n.x+9} ${n.y+160}l55-66 62 66 39-44 46 55v37H${n.x+9}z" fill="#55687b"/><path d="M${n.x+9} ${n.y+181}q100-35 202 0v27H${n.x+9}z" fill="#7b939f"/><text x="${n.x+n.w/2}" y="${n.y+222}" text-anchor="middle" font-size="8">1536 × 1024</text>`;return s+'</g>';}
function graph(focus,phone){const n=nodes.find(n=>n.id===focus),view=n?`${n.x-22} ${n.y-65} ${n.w+44} ${phone?500:n.h+130}`:'-15 20 1230 650';return `<svg class="graph" viewBox="${view}"><rect class="groupbox" x="15" y="60" width="250" height="358"/><text class="grouplabel" x="25" y="79">加载模型</text><rect class="groupbox" x="294" y="115" width="322" height="500"/><text class="grouplabel" x="304" y="137">提示词</text><path class="wire" stroke="#b79adf" d="M245 137 C440 137 460 137 670 137"/><path class="wire" stroke="#c5d5a5" d="M245 297 C285 297 278 192 315 192 M245 297 C285 297 270 527 315 527"/><path class="wire" stroke="#e5b654" d="M595 192 C630 192 620 154 670 154 M595 527 C640 527 625 171 670 171"/><path class="wire" stroke="#dc9bac" d="M245 492 C610 492 600 188 670 188"/><path class="wire" stroke="#dca5bf" d="M885 137 C930 137 920 337 955 337"/>${nodes.map(v=>node(v,focus)).join('')}</svg>`}
const switcher=()=>`<button class="switch ${skin?'on':''}" role="switch" aria-checked="${skin}" aria-label="替换节点样式" data-command="skin"></button>`;
function hardware(){return `<div class="hardware">${[['GPU','12%',12],['CPU','8%',8],['VRAM','43%',43],['RAM','51%',51]].map(([k,v,n])=>`<div class="metric"><label>${k}<b>${v}</b></label><div class="meter"><i style="width:${n}%"></i></div></div>`).join('')}</div>`}
function header(wide){return `<div class="app-head"><div class="title-capsule glass">${icon(wide?'grid':'back')}<div style="min-width:0"><small><i class="dot"></i>已连接 · 已保存</small><b>WorkFisher 全能生图</b></div></div>${wide?'<div class="head-spacer"></div>':''}${round('more','','画布菜单')}${round('play','run','运行')}</div>${hardware()}`}
function tools(focus){const n=nodes.find(n=>n.id===focus);return `<div class="focus-tools glass"><button class="plain" data-command="fit" aria-label="总览">${icon('fit')}</button><button class="selected-node" data-command="next">${icon('node')} ${n?n.title:'滚动选择节点'} <small>${n?'3 / 7':'7 个节点'}</small> ${icon('chevron')}</button><button class="plain favorite" data-command="favorite" aria-label="收藏节点">${icon('star')}</button></div>`}
let wideFocus=null,phoneFocus='prompt',settingsSurface=null;
function render(){document.getElementById('phone').innerHTML=`<div class="status"><span>9:41</span><i class="island"></i><div class="status-right">▥ ◔ <i class="battery"></i></div></div>${header(false)}<div class="graph-wrap">${graph(phoneFocus,true)}</div><div class="graph-hint">${skin?'Pocket 节点外观':'ComfyUI 原生外观'} · 已聚焦 #21</div>${tools(phoneFocus)}<nav class="tabbar glass">${[['grid','工作台'],['task','任务'],['image','作品'],['link','连接']].map(([i,n],k)=>`<button class="${k===0?'current':''}" aria-label="${n}">${icon(i)}${n}</button>`).join('')}</nav><i class="home-indicator"></i>`;
document.getElementById('tablet').innerHTML=`${header(true)}<div class="graph-wrap">${graph(wideFocus,false)}</div><div class="graph-hint">WorkFisher / 主画布 · ${skin?'美化样式':'原生样式'}</div><div class="tool-rail glass">${['plus','folder','image','undo'].map(i=>`<button class="plain" aria-label="${i}">${icon(i)}</button>`).join('')}</div><aside class="sidebar glass"><h3>节点导航 ${icon('panel')}</h3><div class="search">${icon('search')} 搜索节点或编号</div><div class="seg"><span class="active">全部节点</span><span>收藏 · 2</span></div>${nodes.filter(n=>!['clip','negative'].includes(n.id)).map(n=>`<button class="node-row ${n.id===(wideFocus||'prompt')?'active':''}" data-node="${n.id}">${icon('node')}<span class="row-name">${n.title}<small>${n.id==='prompt'?'#21 · 提示词':n.id==='model'?'#12 · 模型加载':n.id==='sample'?'#45 · 采样':'主图节点'}</small></span>${['prompt','sample'].includes(n.id)?'<span class="star">☆</span>':''}</button>`).join('')}<div class="divider"></div><p class="description">点击节点直接定位原画布。<br>星标收藏常用节点。</p></aside>${tools(wideFocus)}<button class="overview glass" data-command="fit" aria-label="全图">${icon('fit')}</button>`;if(settingsSurface)showSettings();}
function showSettings(){const surface=document.getElementById(settingsSurface);surface.querySelector('.settings-overlay')?.remove();surface.insertAdjacentHTML('beforeend',`<div class="settings-overlay"><section class="settings-panel" role="dialog" aria-modal="true" aria-label="外观设置"><header><h2>设置</h2><button class="close-settings" data-command="close-settings">完成</button></header><div class="breadcrumb">外观 / 工作流画布</div><h3>节点外观</h3><div class="setting-card"><div class="switch-row">替换节点样式 ${switcher()}</div><p>关闭时保留 ComfyUI 原生节点外观。开启后使用 Pocket 主题样式，不改变节点布局、连线与功能。</p><div class="setting-state">当前：${skin?'Pocket 主题样式':'ComfyUI 原生样式（默认）'}</div></div><p>此设置对所有工作流生效。</p></section></div>`);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-command],[data-node]');if(!b)return;if(b.dataset.command==='more'){settingsSurface=b.closest('.device').id;showSettings()}else if(b.dataset.command==='close-settings'){settingsSurface=null;render()}else if(b.dataset.command==='skin'){skin=!skin;render()}else if(b.dataset.node){if(b.closest('.phone'))phoneFocus=b.dataset.node;else wideFocus=b.dataset.node;render()}else if(b.dataset.command==='fit'){if(b.closest('.phone'))phoneFocus=null;else wideFocus=null;render()}else if(b.dataset.command==='next'){let f=b.closest('.phone')?phoneFocus:wideFocus;const next=nodes[(nodes.findIndex(n=>n.id===f)+1)%nodes.length].id;if(b.closest('.phone'))phoneFocus=next;else wideFocus=next;render()}else if(b.dataset.command==='favorite')b.classList.toggle('favorite');});render();if(p.get('settings')==='1'){settingsSurface='phone';showSettings();}
</script></body></html>
